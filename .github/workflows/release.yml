name: Release

# Publishes `@patroltech/sdk-api` to npm with provenance when the version in
# package.json is not on npm yet: on a merge to main that changes it, or by hand
# on main. Then creates the `v<version>` tag and GitHub release (also later, if
# that step failed after publishing). Pushing a tag publishes nothing on purpose:
# only what reached main through a pull request with green CI may publish.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    # Only main, also when run by hand (the environment enforces it too).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      on-npm: ${{ steps.version.outputs.on-npm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the version
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if output=$(npm view "$name@$version" version 2>&1); then
            echo "::notice::$name@$version is already on npm: nothing to publish."
            echo "on-npm=true" >> "$GITHUB_OUTPUT"
          elif grep -q E404 <<< "$output"; then
            echo "on-npm=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not ask npm whether $name@$version exists. Run this workflow again."
            exit 1
          fi

  # Build without any secret or write permission; publish only ships the tarball.
  build:
    needs: check
    if: needs.check.outputs.on-npm == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Build, test and pack
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
          npm pack --ignore-scripts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # npm trusted publishing (OIDC, no token to renew), which npm ties to this
    # environment, limited to main.
    environment: npm
    permissions:
      id-token: write # trusted publishing and npm provenance
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Publish to npm
        id: publish
        run: |
          # Trusted publishing needs npm 11.5.1 or later.
          if ! node -e "const [a, b, c] = process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)" "$(npm --version)"; then
            echo "::error::npm $(npm --version) cannot use trusted publishing (needs 11.5.1 or later)."
            exit 1
          fi
          npm publish ./*.tgz --provenance --access public --ignore-scripts
          echo "published=true" >> "$GITHUB_OUTPUT"

  release:
    needs: [check, publish]
    if: >-
      always() && needs.check.result == 'success' &&
      (needs.check.outputs.on-npm == 'true' || needs.publish.outputs.published == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # tag and GitHub release
    steps:
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.check.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
