name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # No install scripts: nothing in the toolchain needs them.
      - run: npm ci --ignore-scripts

      - run: npm run format:check

      # Generates the client from openapi/openapi.public.json, then compiles ESM and CJS.
      - run: npm run build

      - run: npm test

      - run: npm run examples:check

      - name: Load the package as a consumer would
        run: |
          node -e "const sdk = require('@patroltech/sdk-api'); if (typeof sdk.listRoutes !== 'function') process.exit(1)"
          node --input-type=module -e "import { listRoutes } from '@patroltech/sdk-api'; if (typeof listRoutes !== 'function') process.exit(1)"
