name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The automated contract PR merges itself: it may only bring the contract
      # and the version. The check runs main's copy of the script, so the PR
      # cannot change it (and its token cannot change workflows).
      - name: Check the scope of the contract-sync pull request
        if: github.head_ref == 'contract-sync'
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          git show origin/main:scripts/check-contract-sync-scope.mjs > "$RUNNER_TEMP/check-scope.mjs"
          node "$RUNNER_TEMP/check-scope.mjs" origin/main

      # No install scripts: nothing in the toolchain needs them.
      - run: npm ci --ignore-scripts

      - run: npm run format:check

      # Generates the client from openapi/openapi.public.json, then compiles ESM and CJS.
      - run: npm run build

      - run: npm test

      - run: npm run examples:check

      - name: Load the package as a consumer would
        run: |
          node -e "const sdk = require('@patroltech/sdk-api'); if (typeof sdk.listRoutes !== 'function') process.exit(1)"
          node --input-type=module -e "import { listRoutes } from '@patroltech/sdk-api'; if (typeof listRoutes !== 'function') process.exit(1)"
