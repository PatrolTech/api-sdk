version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # orval may be bumped here: CI fails if the generated client loses an
    # operation of the contract (src/contract.spec.ts).
    ignore:
      # A TypeScript major changes the emitted code and module options: on purpose too.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
